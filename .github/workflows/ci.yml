name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      # Integration tests build the normal binary as well as the test harnesses.
      - name: Build and test
        run: cargo test --locked --verbose
      - name: Timeline router unit tests
        run: node --test tests/unit/timeline-route.test.js

  # Release-tag caches cannot be reused by later tags. Populate this on main,
  # where tag workflows can restore it. E2E already produces the Linux cache.
  warm-macos-release-cache:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-aarch64-apple-darwin
      - name: Build release dependencies and binary
        run: cargo build --locked --release --target aarch64-apple-darwin
